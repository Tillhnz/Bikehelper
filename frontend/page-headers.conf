# Wie security-headers.conf, aber für Seiten (HTML): Wer BikeHelper einbetten darf, fragt nginx beim Backend ab
# (Administration → Zugang). Ohne Eintrag bleibt das Einbetten verboten.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $bh_xfo always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(self), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $bh_frame_ancestors" always;
