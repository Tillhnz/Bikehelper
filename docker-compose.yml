services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bikehelper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bikehelper
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikehelper"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bikehelper:${POSTGRES_PASSWORD}@db:5432/bikehelper
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      TOKEN_EXPIRE_DAYS: ${TOKEN_EXPIRE_DAYS:-7}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_DARK: ${MAP_TILE_DARK:-true}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      GEO_ENABLED: ${GEO_ENABLED:-true}
      UPDATER_URL: ${UPDATER_URL:-http://updater:9000}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}

  # Führt Updates aus dem Admin-Bereich aus. Kein veröffentlichter Port, nur das Backend erreicht ihn (mit Token).
  # Der Zugriff auf den Docker-Socket entspricht Root-Rechten auf dem Server. Wer das nicht möchte, entfernt
  # diesen Block und aktualisiert mit ./install.sh update im Terminal.
  updater:
    build: ./updater
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - .:/project
      - ${BACKUP_DIR:-./backups}:/project/backups
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
