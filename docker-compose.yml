services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bikehelper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bikehelper
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikehelper"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bikehelper:${POSTGRES_PASSWORD}@db:5432/bikehelper
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_DARK: ${MAP_TILE_DARK:-true}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
